[package]
name = "dependabot-changelog-writer"
description = "Generate a changelog entry from a dependabot PR"
version = "1.3.1"
edition = "2024"
rust-version = "1.85"

[dependencies]
env_logger = { version = "0.11.10", default-features = false }
log = { version = "0.4.29", default-features = false }
serde_json = { version = "1.0.150", default-features = false, features = [
    "alloc",
] }
similar = { version = "3.1.1", default-features = false, features = ["text"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"
testresult = "0.4.1"
assert_cmd = "2.2.2"
test-log = "0.2.20"

# The binary is plenty fast, we optimize for size to reduce the amount that has to be downloaded when the action is run
[profile.release]
strip = true
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
